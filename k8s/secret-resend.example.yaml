# Gabarit uniquement — NE PAS remplir avec la vraie clé et committer ce fichier.
# Pour créer le vrai Secret dans le cluster, utilise la commande impérative
# `kubectl create secret generic ...` documentée dans le README (section
# Déploiement), qui ne laisse aucune trace de la clé dans le dépôt Git.
apiVersion: v1
kind: Secret
metadata:
  name: mbadet-vitrine-resend
  namespace: mbadet-vitrine
type: Opaque
stringData:
  RESEND_API_KEY: re_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  CONTACT_EMAIL_TO: contact@mbadet.fr
  CONTACT_EMAIL_FROM: 'Contact mbadet.fr <contact@mbadet.fr>'
