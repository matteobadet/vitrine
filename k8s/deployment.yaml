apiVersion: apps/v1
kind: Deployment
metadata:
  name: mbadet-vitrine
  namespace: default # TODO: aligner sur le namespace réellement utilisé par skillforge si différent
  labels:
    app: mbadet-vitrine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mbadet-vitrine
  template:
    metadata:
      labels:
        app: mbadet-vitrine
    spec:
      containers:
        - name: vitrine
          # Tag remplacé en CI par `kubectl set image` (voir .github/workflows/deploy.yml)
          image: ghcr.io/matteobadet/mbadet-vitrine:latest
          ports:
            - containerPort: 4321
          envFrom:
            - secretRef:
                name: mbadet-vitrine-resend
          env:
            - name: PORT
              value: '4321'
            - name: HOST
              value: '0.0.0.0'
          readinessProbe:
            httpGet:
              path: /
              port: 4321
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 4321
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
